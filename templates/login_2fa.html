{% extends "base.html" %}
{% block title %}Verify it's you — Sentinel{% endblock %}
{% block content %}
<section class="auth-form">
  <h1>Enter your 2FA code</h1>
  <p class="muted">Open your authenticator app and enter the current 6-digit code, or use one of your backup codes.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login/2fa">
    <label>Code
      <input type="text" name="code" inputmode="numeric" autocomplete="one-time-code" required autofocus>
    </label>
    <button class="btn btn-primary" type="submit">Verify</button>
  </form>
</section>
{% endblock %}
